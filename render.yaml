services:
  - type: web
    name: attendx-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn attendx_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: attendx_backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
